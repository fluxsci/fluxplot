[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fluxplot"
version = "0.1.0"
description = "matplotlib, but every meaningful thing has a name — semantic SVG plots for the Flux ecosystem"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Kort Driessen" }]
keywords = ["matplotlib", "svg", "semantic", "scientific-visualization", "flux"]
dependencies = [
  "matplotlib>=3.7,<4",
  "numpy",
  "lxml>=4.9",
  "jsonschema>=4",
  "ipykernel>=6.31.0",
  "seaborn>=0.13.2",
  "cmasher"
]

[project.optional-dependencies]
dev = ["pytest>=7"]


[tool.hatch.build.targets.wheel]
packages = ["src/fluxplot"]
# JSON schemas under src/fluxplot/schemas/ ship as package data (default inclusion).

[tool.pytest.ini_options]
testpaths = ["tests"]
