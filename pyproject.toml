[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fluxplot"
version = "0.1.0"
description = "matplotlib, but every meaningful thing has a name — semantic SVG plots for the Flux ecosystem"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kort Driessen" }]
keywords = ["matplotlib", "svg", "semantic", "scientific-visualization", "flux"]
dependencies = [
  "matplotlib>=3.7,<4",
  "numpy",
  "scipy>=1.9",
  "lxml>=4.9",
  "jsonschema>=4",
  "seaborn>=0.13.2",
  "cmasher"
]

[project.optional-dependencies]
dev = ["pytest>=7"]
mesh = ["fast-simplification>=0.1.13,<0.2", "trimesh>=4,<5", "nibabel>=5"]
notebook = ["ipykernel>=6.31.0"]

[project.urls]
Homepage = "https://github.com/fluxsci/fluxplot"
Repository = "https://github.com/fluxsci/fluxplot"
Issues = "https://github.com/fluxsci/fluxplot/issues"

# Local development (uv sync installs this group by default): keeps the .venv usable as a notebook kernel.
[dependency-groups]
dev = ["pytest>=7", "ipykernel>=6.31.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/fluxplot"]
# JSON schemas under src/fluxplot/schemas/ ship as package data (default inclusion).

[tool.hatch.build.targets.sdist]
# The package, its tests and the example scripts the tests run; nothing else from the repo.
include = ["src/fluxplot", "tests", "examples/*.py", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs example scripts in subprocesses (~10 s); skip with -m 'not slow'"]
